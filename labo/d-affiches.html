<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test D : une touche, une affiche</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="commun.css">
<style>
html,body{height:100%}
body{background:#111;overflow:hidden;font-family:Archivo,Helvetica,Arial,sans-serif}
.pile{position:fixed;inset:0}
.affiche{position:absolute;inset:0;background:var(--c);color:var(--e);display:grid;grid-template-columns:min(100vh,58vw) minmax(0,1fr)}
.affiche .lettre{height:100%;display:flex;align-items:center}
.affiche .lettre .carte{width:100%}
.affiche .texte{display:flex;flex-direction:column;justify-content:space-between;padding:clamp(16px,2.4vw,36px);min-width:0}
.affiche .haut{display:flex;justify-content:space-between;gap:16px;font-size:15px;line-height:1.3}
.affiche h1{font:900 clamp(56px,9.4vw,170px)/.84 "Sofia Cond",Impact,sans-serif;text-transform:uppercase;margin:0 0 .12em;overflow-wrap:anywhere}
.affiche .geste{font:400 clamp(18px,1.9vw,28px)/1.22 Caslon,Georgia,serif;margin:0 0 clamp(14px,2vw,28px);max-width:26ch}
.alphabet{display:grid;grid-template-columns:repeat(13,1fr);gap:2px}
.alphabet button{aspect-ratio:1;border:0;background:none;color:inherit;font:800 clamp(12px,1.3vw,19px)/1 Archivo,sans-serif;padding:0;border-radius:3px}
.alphabet button[aria-current]{background:var(--e);color:var(--c)}
.alphabet button:hover{outline:1.5px solid currentColor;outline-offset:-1.5px}
.ouvrir{align-self:flex-start;border:2px solid currentColor;background:none;color:inherit;font:600 15px/1 Archivo,sans-serif;padding:12px 18px;border-radius:999px;margin-bottom:clamp(14px,2vw,26px)}
.ouvrir:hover{background:var(--e);color:var(--c)}
@media (max-width:760px){
  .affiche{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .affiche .lettre{height:auto}
  .affiche .lettre .carte{width:min(100vw,46vh);margin:0 auto}
  .affiche h1{font-size:15vw}
  .affiche .haut{display:none}
}
</style>
</head>
<body>
<main class="pile" id="pile"></main>
<script type="module">
import { ARTISTES, PAR_LETTRE, ecouterClavier, lienLabo, ouvrirDossier } from './donnees.js';
import { carte } from './lettres.js';
const pile = document.getElementById('pile'), reduit = matchMedia('(prefers-reduced-motion: reduce)').matches;
let courant = null;
function affiche(a) {
  const e = document.createElement('section'); e.className = 'affiche'; e.style.setProperty('--c', a.fond); e.style.setProperty('--e', a.encre);
  e.innerHTML = `<div class="lettre">${carte(a.l)}</div>
    <div class="texte">
      <div class="haut"><span>26 graphistes. Tape une lettre.</span><span>${a.dates}<br>${a.pays}</span></div>
      <div>
        <h1>${a.nom}</h1>
        <p class="geste">${a.geste}</p>
        <button class="ouvrir" type="button">Ouvrir le dossier</button>
        <nav class="alphabet" aria-label="Alphabet">${ARTISTES.map(x => `<button data-l="${x.l}"${x.l === a.l ? ' aria-current="true"' : ''} aria-label="${x.l}, ${x.nom}">${x.l}</button>`).join('')}</nav>
      </div>
    </div>`;
  return e;
}
function aller(l) {
  const a = PAR_LETTRE.get(l); if (!a) return;
  if (l === courant) return ouvrirDossier(l, 'aplat', 'affiche');
  const sens = courant && l < courant ? -1 : 1, e = affiche(a), ancien = pile.lastElementChild;
  pile.append(e); courant = l; history.replaceState(null, '', '#' + l.toLowerCase());
  if (ancien && !reduit) e.animate([{ clipPath: sens > 0 ? 'inset(0 0 0 100%)' : 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)' }], { duration: 430, easing: 'cubic-bezier(.7,0,.2,1)' }).finished.then(() => ancien.remove()).catch(() => {});
  else ancien?.remove();
}
pile.addEventListener('click', e => { const b = e.target.closest('.alphabet button'); if (b) aller(b.dataset.l); else if (e.target.closest('.ouvrir')) ouvrirDossier(courant, 'aplat', 'affiche'); });
const pas = p => aller(ARTISTES[(ARTISTES.findIndex(a => a.l === courant) + p + 26) % 26].l);
ecouterClavier({ lettre: aller, fleche: pas, entree: () => ouvrirDossier(courant, 'aplat', 'affiche') });
let x0 = null; pile.addEventListener('pointerdown', e => { x0 = e.clientX; }); pile.addEventListener('pointerup', e => { if (x0 !== null && Math.abs(e.clientX - x0) > 60) pas(e.clientX < x0 ? 1 : -1); x0 = null; });
const h = location.hash.slice(1).toUpperCase(); aller(PAR_LETTRE.has(h) ? h : 'A'); lienLabo();
</script>
</body>
</html>
